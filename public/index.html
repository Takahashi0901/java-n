<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eef1f5;height:100dvh}
#root{height:100%}.login{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0002}
.login h2{margin-top:0}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccd;border-radius:8px;font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
button.link{background:none;color:#2563eb;padding:4px}.err{color:#c62828;font-size:14px}
.app{display:flex;height:100%}.side{width:260px;background:#fff;border-right:1px solid #dde;display:flex;flex-direction:column}
.side header{padding:12px;border-bottom:1px solid #eef;display:flex;justify-content:space-between;align-items:center}
.list{overflow:auto;flex:1}.item{padding:12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f3f3f8}
.item.on{background:#e0e9ff}.dot{width:10px;height:10px;border-radius:50%;background:#bbb}.dot.on{background:#22c55e}
.badge{margin-left:auto;background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.title{padding:12px;background:#fff;border-bottom:1px solid #dde;font-weight:600;display:flex;gap:8px;align-items:center}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 12px;border-radius:14px;background:#fff;align-self:flex-start;word-wrap:break-word}
.m.me{align-self:flex-end;background:#2563eb;color:#fff}.m small{display:block;opacity:.65;font-size:11px}
.send{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #dde}.send input{flex:1;padding:10px;border:1px solid #ccd;border-radius:20px;font-size:16px}
.back{display:none}
@media(max-width:700px){.side{width:100%}.app.chat .side{display:none}.app:not(.chat) .main{display:none}.back{display:inline-block}}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="app.js"></script></body></html>
